name: SecureFlow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secureflow-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.18.4"
  TRIVY_VERSION: "0.76.1"

jobs:
  # ------------------------------------------------------------------ 1. unit tests
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # ------------------------------------------------------------------ 2. scan both targets
  security-scan:
    needs: unit-tests
    runs-on: ubuntu-latest
    # The deliberately vulnerable target is EXPECTED to fail its gate. The job shows red,
    # but the workflow run stays green so the fixed target and the report still publish.
    continue-on-error: ${{ matrix.target == 'vulnerable' }}
    strategy:
      fail-fast: false
      matrix:
        target: [vulnerable, fixed]
    permissions:
      contents: read
      security-events: write
    env:
      TARGET: ${{ matrix.target }}
      IMAGE: secureflow-${{ matrix.target }}:ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare folders
        run: mkdir -p reports out

      - name: Install scanners
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin trivy
          pip install semgrep requests
          gitleaks version
          trivy --version

      # --- Gate 1: secrets
      - name: Secret scan (Gitleaks)
        run: |
          gitleaks detect --no-git --source "app/${TARGET}" \
            --report-format json --report-path reports/gitleaks.json --exit-code 0 --redact

      # --- Gate 2: SAST
      - name: Static analysis (Semgrep)
        run: |
          semgrep scan --config p/python --config p/flask --config p/owasp-top-ten \
            --metrics=off --quiet --json --output reports/semgrep.json "app/${TARGET}"

      # --- Gate 3: dependencies + Dockerfile
      - name: Dependency and Dockerfile scan (Trivy fs)
        run: |
          trivy fs --scanners vuln,misconfig --format json --output reports/trivy-fs.json "app/${TARGET}"

      # --- Gate 4: container image
      - name: Build image
        run: docker build -t "${IMAGE}" "app/${TARGET}"

      - name: Container image scan (Trivy image)
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output reports/trivy-image.json "${IMAGE}"

      # --- Gate 5: running app (DAST + custom scanner)
      - name: Start the app
        run: |
          docker run -d --name target -p 5000:5000 "${IMAGE}"
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && exit 0
            sleep 1
          done
          docker logs target
          exit 1

      - name: Custom web scanner (headers, CORS, cookies)
        run: python -m scanner.webscan --url http://localhost:5000 --output reports/webscan.json

      - name: OWASP ZAP baseline scan
        run: |
          docker run --rm --user root --network host -v "${PWD}/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 -J zap.json -I -m 2 || true

      - name: Stop the app
        if: always()
        run: docker rm -f target || true

      # --- Merge everything, write the report, decide pass/fail
      - name: Aggregate and evaluate the security gate
        id: gate
        continue-on-error: true
        run: |
          python -m aggregator.cli --target "${TARGET}" --reports reports --out out \
            --source-root "app/${TARGET}" --commit "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Show summary on the run page
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureflow-${{ matrix.target }}
          path: |
            out/
            reports/

      - name: Upload findings to the GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: out/secureflow.sarif
          category: secureflow-${{ matrix.target }}

      - name: Enforce the security gate
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::Security gate failed for '${TARGET}'. See the summary above or download the report."
          exit 1

  # ------------------------------------------------------------------ 3. publish dashboard
  publish:
    needs: security-scan
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: secureflow-*
          path: artifacts
      - name: Build the site
        run: python -m aggregator.site --input artifacts --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
